<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | SafeStride</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="{{ url_for('index') }}" class="brand">
                <span class="brand-icon">🛡️</span>
                <span>SafeStride</span>
            </a>
            <button id="langToggle" class="btn-outline" aria-label="Switch language" style="margin-left:auto;">தமிழ்</button>
        </div>
    </nav>

    <div class="auth-wrap">
        <div class="auth-card">
            <h2 data-i18n="registerTitle">Create Account</h2>
            <p data-i18n="registerText">Join SafeStride to protect your travel.</p>
            <div class="flash-messages">
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% for category, message in messages %}
                        <div class="flash-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endwith %}
            </div>
            <form method="POST">
                <div class="form-group">
                    <label for="full_name" data-i18n="registerFullName">Full Name</label>
                    <input type="text" id="full_name" name="full_name" required>
                </div>
                <div class="form-group">
                    <label for="email" data-i18n="loginEmail">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="phone" data-i18n="registerPhone">Phone</label>
                    <input type="text" id="phone" name="phone">
                </div>
                <div class="form-group">
                    <label for="password" data-i18n="loginPassword">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="form-group">
                    <label for="confirm_password" data-i18n="registerConfirm">Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" required>
                </div>
                <button type="submit" class="btn" style="width:100%;" data-i18n="registerButton">Register</button>
            </form>
            <p style="text-align:center; margin-top:1rem;"><span data-i18n="haveAccount">Already have an account?</span> <a href="{{ url_for('login') }}" data-i18n="navLogin">Login</a></p>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
